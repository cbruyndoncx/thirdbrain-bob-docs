site_name: BOB Documentation
site_description: Documentation, skills and workflows for BOB, the AI business workspace
site_url: https://cbruyndoncx.github.io/bob-docs/   # owner 2026-10-17: github.io for now; brn.cx cards and redirects link here
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
