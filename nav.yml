# The docs site's menu. Paths are relative to docs/ (Wiki pages keep the vault's folders, so links
# and release pointers stay stable); the labels are what readers see.
#
# scripts/nav_hook.py reads this file at build time. It:
#   - replaces `Library: generated` with the skills and workflows from data/catalogue.json,
#     grouped by business area;
#   - leaves out entries whose page no longer exists (a renamed Wiki page), and logs them;
#   - leaves the `hidden` pages out of the menu (they are still built, linked and searchable);
#   - adds every other page that is in neither list to "More", so a new Wiki page is never lost.
#     When a page shows up there, give it a place below;
#   - treats `page.md#anchor` as a shortcut to a section of a page that is listed elsewhere.

